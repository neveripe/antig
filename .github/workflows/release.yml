name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build web application bundle
      run: |
        cd web
        python build.py
    
    - name: Create release package
      run: |
        mkdir -p release
        cp web/dist/index.html release/Energy-Processor.html
        cp web/USER_GUIDE.md release/
        cp README.md release/
        cd release
        # Create versioned ZIP
        zip -r ../Energy-Processor-Web-${{ github.ref_name }}.zip .
        # Create "latest" copy for convenience
        zip -r ../Energy-Processor-Web-latest.zip .
    
    - name: Extract version and codename from tag
      id: version_info
      run: |
        VERSION="${GITHUB_REF#refs/tags/}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        # Extract codename from git tag annotation if present
        CODENAME=$(git tag -l --format='%(contents:subject)' "$VERSION")
        if [ -z "$CODENAME" ]; then
          CODENAME="Release $VERSION"
        fi
        echo "codename=$CODENAME" >> $GITHUB_OUTPUT
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: "${{ steps.version_info.outputs.version }} - ${{ steps.version_info.outputs.codename }}"
        files: |
          Energy-Processor-Web-${{ github.ref_name }}.zip
          Energy-Processor-Web-latest.zip
        body: |
          ## Energy Stats Processor ${{ steps.version_info.outputs.version }}
          **${{ steps.version_info.outputs.codename }}**
          
          ### 📦 What's Included
          
          - **Energy-Processor.html** - Single-file web application (works offline!)
          - **USER_GUIDE.md** - Step-by-step instructions for non-technical users
          - **README.md** - Project information and technical details
          
          ### 🚀 Quick Start
          
          1. **Download** the ZIP file below
          2. **Extract** it to a folder on your computer
          3. **Double-click** Energy-Processor.html to open in your browser
          4. **Follow** the USER_GUIDE.md for detailed instructions
          
          ### ✨ Features
          
          - Process ESB Networks energy data
          - Generate interactive graphs
          - View import/export statistics
          - Works completely offline (no internet needed after download)
          - Privacy-first (all processing happens in your browser)
          
          ### 📊 Supported Data
          
          - ESB Networks HDF CSV files (30-minute readings in calculated kWh)
          
          ---
          
          **Need help?** Check the USER_GUIDE.md file included in the download.
        draft: false
        prerelease: false
